<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>台北・夜雨 V0.2</title><style>*{box-sizing:border-box}body{margin:0;background:#080d1a;color:white;font-family:system-ui;overflow:hidden;touch-action:none}canvas{display:block;width:100vw;height:100dvh}button{position:absolute;border:1px solid #ffffff66;background:#25344b99;color:white;border-radius:50%;width:68px;height:68px;font-size:24px;touch-action:none;user-select:none;-webkit-user-select:none}.left{left:18px;bottom:26px}.right{left:96px;bottom:26px}.jump{right:98px;bottom:26px}.attack{right:18px;bottom:26px;background:#8d283bba}.hint{position:absolute;top:10px;left:12px;font-size:13px;color:#e9f0ff;text-shadow:0 2px 5px #000}#reset{position:absolute;top:8px;right:10px;border-radius:10px;width:auto;height:auto;padding:8px;font-size:13px}
</style></head><body><canvas id="game"></canvas><div class="hint">台北・夜雨 V0.2　← → 移動／↑ 跳躍／⚔ 攻擊</div><button id="reset">重來</button><button class="left" data-key="left">◀</button><button class="right" data-key="right">▶</button><button class="jump" data-key="jump">↑</button><button class="attack" data-key="attack">⚔</button>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');let W=0,H=0,ground=0;const key={left:false,right:false,jump:false,attack:false};let player,enemy,raindrops=[],orbs=[],frame=0;function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight;ground=H*.73;raindrops=Array.from({length:100},()=>({x:Math.random()*W,y:Math.random()*H,l:8+Math.random()*15}));}function reset(){orbs=[];player={x:W*.23,y:ground-55,vx:0,vy:0,w:30,h:55,face:1,hp:5,cd:0,attack:0,inv:0};enemy={x:W*.75,y:ground-52,w:30,h:52,hp:5,cd:0,alive:true};}resize();reset();addEventListener('resize',()=>{resize();reset()});document.getElementById('reset').onclick=reset;
for(const b of document.querySelectorAll('[data-key]')){const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);key[k]=true});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>key[k]=false)}addEventListener('keydown',e=>{const k={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'jump',Space:'attack'}[e.code]||({a:'left',d:'right',w:'jump',j:'attack'}[e.key]);if(k){key[k]=true;e.preventDefault()}});addEventListener('keyup',e=>{const k={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'jump',Space:'attack'}[e.code]||({a:'left',d:'right',w:'jump',j:'attack'}[e.key]);if(k)key[k]=false});
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}function draw(){ctx.clearRect(0,0,W,H);let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#0b1329');sky.addColorStop(1,'#35405b');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H); // Taipei-inspired skyline
ctx.fillStyle='#18253b';for(let i=0;i<16;i++){let x=i*W/15,hh=45+(i*29%110);ctx.fillRect(x,ground-hh,W/18,hh)}let tx=W*.62;ctx.fillStyle='#3e5b6e';ctx.fillRect(tx,ground-210,23,210);ctx.fillRect(tx-7,ground-195,37,8);for(let j=0;j<6;j++)ctx.fillRect(tx-4-j*.5,ground-190+j*23,31+j,5);ctx.fillStyle='#ffcf79';for(let i=0;i<23;i++){let x=(i*97)%W,y=ground-30-(i*53%130);ctx.fillRect(x,y,3,5)}rect(0,ground,W,H-ground,'#283044');rect(0,ground,W,7,'#596177');for(let i=0;i<W;i+=55)rect(i,ground+20,34,2,'#697080');
// rain
ctx.strokeStyle='#a5c5f45a';ctx.lineWidth=1;for(const r of raindrops){ctx.beginPath();ctx.moveTo(r.x,r.y);ctx.lineTo(r.x-4,r.y+r.l);ctx.stroke();r.y+=8;r.x-=2;if(r.y>H){r.y=-20;r.x=Math.random()*W}}
// V0.2 black-armored ninja with animated crimson scarf and sword
let p=player,run=Math.sin(frame*.34)*(Math.abs(p.vx)>0?1:0),air=p.y+p.h<ground-2;
ctx.save();ctx.translate(p.x+p.w/2,p.y);ctx.scale(p.face,1);
if(p.inv%8<4||p.inv===0){
// scarf flows opposite the direction of travel
ctx.fillStyle='#a62942';ctx.beginPath();ctx.moveTo(-7,14);ctx.quadraticCurveTo(-22,12+run*3,-31-Math.abs(p.vx)*2,10+Math.sin(frame*.22)*5);ctx.lineTo(-23,21+Math.sin(frame*.22)*4);ctx.lineTo(-8,21);ctx.fill();
// legs and boots
ctx.fillStyle='#111724';ctx.save();ctx.translate(-5,40);ctx.rotate(air?-.45:run*.35);ctx.fillRect(-5,0,10,15);ctx.fillStyle='#323c50';ctx.fillRect(-6,12,12,5);ctx.restore();
ctx.fillStyle='#121925';ctx.save();ctx.translate(6,40);ctx.rotate(air?.5:-run*.35);ctx.fillRect(-4,0,10,15);ctx.fillStyle='#323c50';ctx.fillRect(-4,12,12,5);ctx.restore();
// chest armor and red belt
ctx.fillStyle='#171e2b';ctx.fillRect(-12,20,24,23);ctx.fillStyle='#344052';ctx.fillRect(-9,23,18,11);ctx.fillStyle='#982b3f';ctx.fillRect(-12,36,24,4);
// head, spiky hair, mask and eyes
ctx.fillStyle='#d1a48b';ctx.fillRect(-9,5,18,16);ctx.fillStyle='#141b28';ctx.beginPath();ctx.moveTo(-12,12);ctx.lineTo(-10,3);ctx.lineTo(-5,5);ctx.lineTo(-2,-2);ctx.lineTo(3,3);ctx.lineTo(9,-1);ctx.lineTo(12,9);ctx.lineTo(9,15);ctx.closePath();ctx.fill();ctx.fillRect(-10,13,20,8);ctx.fillStyle='#e9f3ff';ctx.fillRect(2,11,6,2);
// arms and katana
ctx.fillStyle='#2a3446';ctx.fillRect(-16,24,6,17);ctx.fillRect(9,23,7,17);ctx.strokeStyle='#e1efff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(14,31);ctx.lineTo(p.attack>0?47:29,p.attack>0?5:45);ctx.stroke();
if(p.attack>0){ctx.strokeStyle='#c8e8ff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(19,24,34,-1.1,1.1);ctx.stroke()}
}ctx.restore();
// defeated enemies drop red soul orbs (visual preview, no ultimate yet)
for(const orb of orbs){ctx.save();ctx.globalAlpha=Math.min(1,orb.life/25);ctx.shadowColor='#ff3159';ctx.shadowBlur=13;ctx.fillStyle='#ff4567';ctx.beginPath();ctx.arc(orb.x,orb.y,5+Math.sin(frame*.18)*1.2,0,Math.PI*2);ctx.fill();ctx.restore()}
if(enemy.alive){let e=enemy;rect(e.x,e.y+15,e.w,e.h-15,'#353945');rect(e.x+4,e.y,e.w-8,18,'#52596a');rect(e.x+8,e.y+9,5,3,'#f34958');rect(e.x+18,e.y+9,5,3,'#f34958');rect(e.x+4,e.y-12,e.w*e.hp/5,4,'#ec5966')}
rect(15,36,110,8,'#263249');rect(15,36,110*p.hp/5,8,'#e35164');ctx.fillStyle='#fff';ctx.font='14px system-ui';ctx.fillText('忍者 HP',15,30);if(!enemy.alive){ctx.font='bold 25px system-ui';ctx.fillText('勝利！按「重來」再戰',Math.max(16,W/2-115),H*.32)} }
function update(){frame++;for(const orb of orbs){orb.y-=.35;orb.life--}orbs=orbs.filter(o=>o.life>0);let p=player;p.vx=(key.right?4:0)-(key.left?4:0);if(p.vx)p.face=Math.sign(p.vx);p.x=Math.max(0,Math.min(W-p.w,p.x+p.vx));if(key.jump&&p.y+p.h>=ground-1){p.vy=-11;key.jump=false}p.vy+=.55;p.y+=p.vy;if(p.y+p.h>=ground){p.y=ground-p.h;p.vy=0}if(p.cd>0)p.cd--;if(p.attack>0)p.attack--;if(p.inv>0)p.inv--;if(key.attack&&p.cd===0){p.cd=24;p.attack=11;if(enemy.alive&&Math.abs((enemy.x+enemy.w/2)-(p.x+p.w/2))<90&&Math.abs(enemy.y-p.y)<65&&((enemy.x-p.x)*p.face>=-10)){enemy.hp--;enemy.x=Math.max(0,Math.min(W-enemy.w,enemy.x+p.face*30));if(enemy.hp<=0){enemy.alive=false;for(let i=0;i<4;i++)orbs.push({x:enemy.x+enemy.w/2+(i-1.5)*13,y:enemy.y+16+i%2*10,life:240})}}}if(enemy.alive){if(enemy.cd>0)enemy.cd--;if(Math.abs(enemy.x-p.x)>48)enemy.x+=Math.sign(p.x-enemy.x)*.65;if(Math.abs(enemy.x-p.x)<37&&Math.abs(enemy.y-p.y)<50&&enemy.cd===0&&p.inv===0){p.hp=Math.max(0,p.hp-1);p.inv=55;enemy.cd=65;if(p.hp===0)reset()}}draw();requestAnimationFrame(update)}update();

</script></body></html>
